name: Build KSUN Manager 32473 (N971N)

on:
  push:
    branches: [ "rsuntk" ]
    paths:
      - ".github/workflows/build-ksun-manager-32473.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ksuinit:
    uses: KernelSU-Next/KernelSU-Next/.github/workflows/ksuinit.yml@dev

  build-ksud-arm64:
    needs: build-ksuinit
    uses: KernelSU-Next/KernelSU-Next/.github/workflows/ksud.yml@dev
    with:
      target: aarch64-linux-android
      os: ubuntu-latest
      pack_lkm: false
      pack_ksuinit: true

  build-ksud-x64:
    needs: build-ksuinit
    uses: KernelSU-Next/KernelSU-Next/.github/workflows/ksud.yml@dev
    with:
      target: x86_64-linux-android
      os: ubuntu-latest
      pack_lkm: false
      pack_ksuinit: true

  build-ksud-riscv64:
    needs: build-ksuinit
    uses: KernelSU-Next/KernelSU-Next/.github/workflows/ksud.yml@dev
    with:
      target: riscv64-linux-android
      os: ubuntu-latest
      pack_lkm: false
      pack_ksuinit: true

  build-manager:
    needs: [build-ksud-arm64, build-ksud-x64, build-ksud-riscv64]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - name: Checkout KernelSU-Next manager source
        uses: actions/checkout@v7
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: dev
          fetch-depth: 0

      - name: Pin manager versionCode to kernel driver 32473
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.gradle.kts")
          s = p.read_text()
          old = "return major * 30000 + commitCount"
          if old not in s:
              raise SystemExit("Expected versionCode expression not found; refusing to build a mismatched APK")
          p.write_text(s.replace(old, "return 32473", 1))
          PY

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Download arm64 ksud
        uses: actions/download-artifact@v7
        with:
          name: ksud-aarch64-linux-android
          path: .

      - name: Download x86_64 ksud
        uses: actions/download-artifact@v7
        with:
          name: ksud-x86_64-linux-android
          path: .

      - name: Download riscv64 ksud
        uses: actions/download-artifact@v7
        with:
          name: ksud-riscv64-linux-android
          path: .

      - name: Install ksud into manager
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64 app/src/main/jniLibs/riscv64
          cp -f ../aarch64-linux-android/release/ksud app/src/main/jniLibs/arm64-v8a/libksud.so
          cp -f ../x86_64-linux-android/release/ksud app/src/main/jniLibs/x86_64/libksud.so
          cp -f ../riscv64-linux-android/release/ksud app/src/main/jniLibs/riscv64/libksud.so

      - name: Build release APK
        run: ./gradlew clean assembleRelease

      - name: Verify APK version and package
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "APK=$APK"
          $ANDROID_HOME/build-tools/36.1.0/aapt dump badging "$APK" | head -n 2
          sha256sum "$APK"

      - name: Upload manager APK
        uses: actions/upload-artifact@v7
        with:
          name: KernelSU-Next-Manager-v32473-N971N
          path: manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
