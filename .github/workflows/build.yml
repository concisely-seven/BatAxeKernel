name: Build (CI)
run-name: 'Se7enKernel oG-SUSFS d1xks / Clang 13'

on:
  push:
    branches:
      - Se7enKernel-oG-SUSFS-d1xks
  workflow_dispatch:
    inputs:
      version:
        description: 'Kernel Version'
        required: true
        default: 'v'
      llvm:
        description: 'Clang (12-20) or Neutron (Latest) Version'
        required: true
        default: 'latest'
      devices:
        description: 'Devices'
        required: true
        default: '["d1", "d1xks", "d2s", "d2x", "beyond0lte", "beyond1lte", "beyond2lte", "beyondx"]'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        device: ${{ fromJSON(github.event.inputs.devices || '["d1xks"]') }}

    steps:
      - name: Checkout Tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          sudo apt update && sudo apt upgrade -y && sudo apt install --no-install-recommends -y build-essential gcc-aarch64-linux-gnu clang lld llvm
          
      - name: Set Environment Variable
        run: |
          SHA=$(git rev-parse --short ${{ github.sha }})
          echo BUILD_DATE=$(date +'%Y%m%d') >> $GITHUB_ENV
          echo BUILD_KERNEL_VERSION=oG-SUSFS >> $GITHUB_ENV
          
      - name: Building Kernel and verifying ZIP
        shell: bash
        run: |
          set -eo pipefail
          LLVM=13 bash build.sh -m d1xks -v oG-SUSFS -l 13 -r y

          mkdir -p artifacts
          mapfile -t ZIP_FILES < <(find build -type f -name '*.zip' ! -name 'module.zip' ! -path '*/toolchain/*' | sort)
          if (( ${#ZIP_FILES[@]} == 0 )); then
            echo "ERROR: build.sh reported success but produced no flashable ZIP."
            echo "Files under build/export:"
            find build/export -maxdepth 2 -type f -print 2>/dev/null || true
            echo "ZIP files under build:"
            find build -type f -name '*.zip' -print
            exit 1
          fi

          for file in "${ZIP_FILES[@]}"; do
            cp -f "$file" "artifacts/$(basename "$file")"
          done

          shopt -s nullglob
          PACKAGES=(artifacts/*.zip)
          if (( ${#PACKAGES[@]} == 0 )); then
            echo "ERROR: artifact staging directory is empty."
            exit 1
          fi
          for package in "${PACKAGES[@]}"; do
            echo "Validating $package"
            unzip -t "$package"
          done
          sha256sum "${PACKAGES[@]}" > artifacts/SHA256SUMS

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: "Se7enKernel-oG-SUSFS-d1xks-${{ env.BUILD_DATE }}-Clang13"
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
