name: Build (CI)
run-name: 'CI: Build ${{ github.event.inputs.version }} for device ${{ github.event.inputs.devices }}'

on:
  push:
    branches:
      - Se7enKernel-oG-SUSFS-d1xks
  workflow_dispatch:
    inputs:
      version:
        description: 'Kernel Version'
        required: true
        default: 'v'
      llvm:
        description: 'Clang (12-20) or Neutron (Latest) Version'
        required: true
        default: 'latest'
      devices:
        description: 'Devices'
        required: true
        default: '["d1", "d1xks", "d2s", "d2x", "beyond0lte", "beyond1lte", "beyond2lte", "beyondx"]'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        device: ${{ fromJSON(github.event.inputs.devices || '["d1xks"]') }}

    steps:
      - name: Checkout Tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          sudo apt update && sudo apt upgrade -y && sudo apt install --no-install-recommends -y build-essential gcc-aarch64-linux-gnu clang lld llvm
          
      - name: Set Environment Variable
        run: |
          SHA=$(git rev-parse --short ${{ github.sha }})
          echo BUILD_DATE=$(date +'%Y%m%d') >> $GITHUB_ENV
          echo BUILD_KERNEL_VERSION=oG-SUSFS >> $GITHUB_ENV
          
      - name: Building Kernel
        run: |
            bash build.sh -m ${{ matrix.device }} -v oG-SUSFS -l 13 -r y

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: "Se7enKernel-oG-SUSFS-d1xks-${{ env.BUILD_DATE }}-Clang13"
          path: "build/export/*.zip"
          if-no-files-found: error
