name: Build N971N Binary2 RKSU + SUSFS 2.4.0 (Dex2Oat mount fix)
run-name: "SeVenkernel RKSU SUSFS240 - d1xks - Clang 13 (Dex2Oat mount fix)"

on:
  push:
    branches:
      - RKSU-susfs1512-fix-from-run8
      - RKSU-susfs240-dex2oat-mount-test
      - RKSU-susfs240-dex2oat-mount-fix
    paths:
      - 'build.sh'
      - 'apply-susfs.sh'
      - '.github/workflows/build-rksu-susfs1512.yml'
      - 'arch/arm64/configs/**'
      - 'drivers/**'
      - 'fs/**'
      - 'include/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Run #8-derived fix branch with pinned submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Verify Run #8 RKSU source and pinned submodule
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'url = https://github.com/rsuntk/KernelSU.git' .gitmodules
          git -C KernelSU fetch --depth=1 origin 9b28326af4145974560122644e87fc9a021a2cce
          git -C KernelSU checkout --detach 9b28326af4145974560122644e87fc9a021a2cce
          test "$(git -C KernelSU rev-parse HEAD)" = "9b28326af4145974560122644e87fc9a021a2cce"
          grep -q 'config KSU_SUSFS' KernelSU/kernel/Kconfig
          grep -q 'KernelSU-SusFS version' KernelSU/kernel/Makefile
          echo "Run #8-derived kernel base + native SUSFS-enabled RKSU submodule verified."

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu clang lld llvm \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            python3 python-is-python3 zip curl cpio rsync device-tree-compiler

      - name: Build N971N Binary2 RKSU kernel with Clang 13
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh
          bash build.sh -m d1xks -v B2-RKSU-SUSFS240-Dex2OatFix -k y -l 13 -r y

      - name: Verify flashable ZIP and build identity
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(build/export/*.zip)
          test "${#zips[@]}" -eq 1
          unzip -t "${zips[0]}"
          unzip -l "${zips[0]}" | grep -q 'boot.img'
          unzip -l "${zips[0]}" | grep -q 'dtb.img'
          unzip -l "${zips[0]}" | grep -q 'dtbo.img'
          unzip -l "${zips[0]}" | grep -q 'module.zip'
          name="$(basename "${zips[0]}")"
          [[ "$name" == SeVenkernel-RKSU-SUSFS-d1xks*.zip ]]
          unzip -p "${zips[0]}" META-INF/com/google/android/updater-script > /tmp/updater-script
          ! grep -Eiq 'Binary 7|Binaries Support: 7|Binary 8|Binary 9' /tmp/updater-script
          echo "ZIP integrity and SeVenkernel RKSU naming verified."

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SeVenkernel-RKSU-SUSFS-d1xks-dex2oat-mount-fix-${{ github.run_number }}-Clang13
          path: build/export/*.zip
          if-no-files-found: error
          compression-level: 9

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SeVenkernel-RKSU-SUSFS240-dex2oat-mount-fix-build-log
          path: build.log
          if-no-files-found: ignore
