name: Build N971N Binary2 RKSU + SUSFS 1.5.12
run-name: "SeVenkernel RKSU SUSFS1512 - d1xks - Clang 13"

on:
  push:
    branches:
      - RKSU-susfs1512
    paths:
      - 'build.sh'
      - 'apply-susfs.sh'
      - '.github/workflows/build-rksu-susfs1512.yml'
      - 'arch/arm64/configs/**'
      - 'drivers/**'
      - 'fs/**'
      - 'include/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Run #5 baseline with pinned submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Verify exact Run #5 RKSU source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C KernelSU rev-parse HEAD)" = "88e37d606fc12758421c3e36b0f61499610cfe8d"
          grep -q 'url = https://github.com/rsuntk/KernelSU.git' .gitmodules
          echo "Run #5 RKSU submodule verified."

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu clang lld llvm \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            python3 python-is-python3 zip curl cpio rsync device-tree-compiler

      - name: Build N971N Binary2 RKSU kernel with Clang 13
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh
          bash build.sh -m d1xks -v B2-RKSU-SUSFS1512 -k y -l 13 -r y

      - name: Verify flashable ZIP and build identity
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(build/export/*.zip)
          test "${#zips[@]}" -eq 1
          unzip -t "${zips[0]}"
          unzip -l "${zips[0]}" | grep -q 'boot.img'
          unzip -l "${zips[0]}" | grep -q 'dtb.img'
          unzip -l "${zips[0]}" | grep -q 'dtbo.img'
          unzip -l "${zips[0]}" | grep -q 'module.zip'
          name="$(basename "${zips[0]}")"
          [[ "$name" == SeVenkernel-RKSU-SUSFS-d1xks*.zip ]]
          unzip -p "${zips[0]}" META-INF/com/google/android/updater-script > /tmp/updater-script
          ! grep -Eiq 'Binary 7|Binaries Support: 7|Binary 8|Binary 9' /tmp/updater-script
          echo "ZIP integrity and SeVenkernel RKSU naming verified."

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SeVenkernel-RKSU-SUSFS-d1xks-${{ github.run_number }}-Clang13
          path: build/export/*.zip
          if-no-files-found: error
          compression-level: 9

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SeVenkernel-RKSU-SUSFS1512-build-log
          path: build.log
          if-no-files-found: ignore
