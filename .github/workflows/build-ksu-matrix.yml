name: Build KernelSU Next Legacy - N971N with official Manager v3.4.2

on:
  pull_request:
    branches: [ "rsuntk" ]
    paths:
      - "build.sh"
      - "scripts/prepare-ksu-variant.sh"
      - "ci/ksu-configs/ksu-ksun.config"
      - ".github/workflows/build-ksu-matrix.yml"
      - "drivers/Kconfig"
      - "drivers/Makefile"
  workflow_dispatch:
    inputs:
      version:
        description: Kernel local version suffix
        required: true
        default: N971N-KSUN-v3.4.2
      ksun_ref:
        description: KernelSU Next Legacy driver branch, tag or exact commit
        required: true
        default: b933b1f728116a456fbebf27b6a8772a640cdf23

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout BatAxeKernel and build-tool submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gcc-aarch64-linux-gnu \
            git libssl-dev lz4 make python3 zip zlib1g-dev

      - name: Prepare Legacy driver with official v3.4.2 Manager ABI
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh scripts/prepare-ksu-variant.sh
          bash scripts/prepare-ksu-variant.sh ksun \
            "${{ inputs.ksun_ref || 'b933b1f728116a456fbebf27b6a8772a640cdf23' }}" \
            "v3.4.2"

      - name: Download and verify the official v3.4.2 Manager
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/export
          APK="build/export/KernelSU_Next_v3.4.2_33355-release.apk"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/KernelSU_Next_v3.4.2_33355-release.apk" \
            -o "$APK"
          echo "774a5511f7034a4930e881114e202319cbdc34c5aaaa5c7c6b6d2902364e4c58  $APK" | sha256sum --check -
          echo "KSU_VERSION_OVERRIDE=33355" >> "$GITHUB_ENV"
          {
            echo "manager_version=v3.4.2"
            echo "manager_version_code=33355"
            echo "manager_apk_sha256=774a5511f7034a4930e881114e202319cbdc34c5aaaa5c7c6b6d2902364e4c58"
            echo "kernel_version_override=33355"
            echo "kernel_uapi_advertised=5"
            echo "manager_uapi=5"
            echo "manager_signature=official-upstream-default"
          } >> build/ksu-source-info.txt

      - name: Build N971N kernel and flashable ZIP
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh -m d1xks -v "${{ inputs.version || 'N971N-KSUN-v3.4.2' }}" -k y -l 13 -r y

      - name: Verify kernel and official Manager pairing
        shell: bash
        run: |
          set -euo pipefail
          test -s out/.config
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KPROBES=y$' out/.config
          grep -q '^CONFIG_KRETPROBES=y$' out/.config
          grep -q '^CONFIG_KSU_KPROBES_HOOK=y$' out/.config
          if grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config; then
            echo "Unexpected Manual Hook mode in KernelSU Next build" >&2
            exit 7
          fi
          grep -Fq -- "-- KernelSU-Next version override: 33355" build.log
          grep -Fq -- "-- KernelSU-Next Manager signature size: 0x3e6" build.log
          grep -Fq -- "-- KernelSU-Next Manager signature hash: 79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7" build.log
          grep -q '^kernel_uapi_advertised=5$' build/ksu-source-info.txt
          grep -q '^manager_uapi=5$' build/ksu-source-info.txt

          cp build/ksu-source-info.txt build/export/
          sha256sum build/export/*.zip build/export/*.apk > build/export/SHA256SUMS

      - name: Upload kernel ZIP, official Manager APK and compatibility metadata
        uses: actions/upload-artifact@v4
        with:
          name: N971N-U2-KernelSU-Next-Legacy-v3.4.2-${{ github.run_number }}
          path: |
            build/export/*.zip
            build/export/*.apk
            build/export/ksu-source-info.txt
            build/export/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
