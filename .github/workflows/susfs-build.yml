name: N971N KernelSU Next + SUSFS 1.5.12
run-name: "N971N d1xks KSUN + SUSFS v1.5.12"

on:
  push:
    branches:
      - kernelsu-next-susfs-1.5.12
      - ksun-susfs-1.5.12-modern-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Install missing build dependencies
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          add_if_missing() {
            command -v "$1" >/dev/null 2>&1 || missing+=("$2")
          }
          add_if_missing make build-essential
          add_if_missing bc bc
          add_if_missing bison bison
          add_if_missing flex flex
          add_if_missing python3 python3
          add_if_missing zip zip
          add_if_missing curl curl
          add_if_missing cpio cpio
          add_if_missing rsync rsync
          add_if_missing dtc device-tree-compiler
          add_if_missing git git
          add_if_missing lz4 lz4
          test -f /usr/include/openssl/ssl.h || missing+=(libssl-dev)
          test -f /usr/include/libelf.h || missing+=(libelf-dev)
          test -f /usr/include/ncurses.h || missing+=(libncurses-dev)
          test -f /usr/include/zlib.h || missing+=(zlib1g-dev)
          if (("${#missing[@]}" > 0)); then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo apt-get install -y --no-install-recommends "${missing[@]}" python-is-python3
          fi
          if ! command -v python >/dev/null 2>&1; then
            sudo ln -sf /usr/bin/python3 /usr/local/bin/python
          fi

      - name: Prepare official KernelSU-Next legacy driver
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-ksu-variant.sh
          bash scripts/prepare-ksu-variant.sh ksun b933b1f728116a456fbebf27b6a8772a640cdf23
          grep -q 'KernelSU-Next/KernelSU-Next.git' build/ksu-source-info.txt
          grep -q 'commit=b933b1f728116a456fbebf27b6a8772a640cdf23' build/ksu-source-info.txt
          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../ksu-src/ksun/kernel"

      - name: Apply SUSFS v1.5.12 for Linux 4.14.113 + KernelSU-Next
        shell: bash
        run: |
          set -euo pipefail
          chmod +x apply-susfs.sh build.sh
          bash apply-susfs.sh

      - name: Build N971N d1xks kernel and flashable ZIP
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh -m d1xks -v N971N-KSUN-SUSFS-1.5.12 -k y -l 13 -r y

      - name: Verify kernel configuration and package
        shell: bash
        run: |
          set -euo pipefail
          test -s out/.config
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q 'SUSFS_VERSION "v1.5.12"' include/linux/susfs.h
          test -d build/export
          ZIP_COUNT=$(find build/export -maxdepth 1 -type f -name '*.zip' | wc -l)
          test "$ZIP_COUNT" -ge 1
          cp build/ksu-source-info.txt build/export/
          (cd build/export && sha256sum *.zip > SHA256SUMS)
          echo "KernelSU Next + SUSFS config verified:"
          grep -E '^CONFIG_KSU(=|_)' out/.config

      - name: Upload kernel ZIP and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: N971N-KSUN-SUSFS-1.5.12-${{ github.run_number }}
          path: |
            build/export/*.zip
            build/export/ksu-source-info.txt
            build/export/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
