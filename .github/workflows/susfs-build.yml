name: N971N KernelSU Next + SUSFS 1.5.12
run-name: "N971N d1xks KSUN + SUSFS minimal boot isolation"

on:
  push:
    branches:
      - test-ksun-susfs-bridge
      - n971n-ksun-susfs-run94-fix
      - n971n-ksun-susfs-minimal-boot-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu clang lld llvm \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            python3 python-is-python3 zip curl cpio rsync device-tree-compiler \
            git lz4 zlib1g-dev

      - name: Prepare official KernelSU-Next legacy driver
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-ksu-variant.sh
          bash scripts/prepare-ksu-variant.sh ksun legacy
          grep -q 'KernelSU-Next/KernelSU-Next.git' build/ksu-source-info.txt
          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../ksu-src/ksun/kernel"

      - name: Apply SUSFS v1.5.12 for Linux 4.14.113 + KernelSU-Next
        shell: bash
        run: |
          set -euo pipefail
          chmod +x apply-susfs.sh build.sh
          bash apply-susfs.sh

      - name: Isolate SUSFS initialization for boot test
        shell: bash
        run: |
          set -euo pipefail
          INIT_FILE="ksu-src/ksun/kernel/core/init.c"
          test -s "$INIT_FILE"
          COUNT=$(grep -c 'susfs_init();' "$INIT_FILE" || true)
          test "$COUNT" -eq 1
          sed -i '/susfs_init();/d' "$INIT_FILE"
          ! grep -q 'susfs_init();' "$INIT_FILE"
          echo "[ISOLATION] SUSFS code remains compiled, but its init hook is disabled for this boot-only diagnostic."

      - name: Build N971N d1xks kernel and flashable ZIP
        shell: bash
        run: |
          set -euo pipefail
          # Keep LOCALVERSION below Linux's 64-character utsrelease limit.
          bash build.sh -m d1xks -v N971N-KSUN-SUSFS-MIN -k y -l 13 -r y

      - name: Collect flashable ZIP for verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/export
          while IFS= read -r -d '' z; do
            case "$z" in
              ./build/export/*.zip) ;;
              *) echo "[PACKAGE] Collecting $z"; cp -f "$z" build/export/ ;;
            esac
          done < <(find . -type f -name '*.zip' -not -path './.git/*' -not -path './toolchain/*' -print0)
          echo "[PACKAGE] Collected ZIPs:"
          find build/export -maxdepth 1 -type f -name '*.zip' -printf '%p %s bytes\\n'

      - name: Diagnose kernel configuration and package
        shell: bash
        run: |
          set -u
          echo "=== KernelSU/SUSFS symbols in final .config ==="
          if test -s out/.config; then
            grep -nE '^(CONFIG_KSU|CONFIG_KSU_|# CONFIG_KSU|CONFIG_OVERLAY_FS|CONFIG_IKCONFIG)' out/.config || true
          else
            echo "ERROR: out/.config missing or empty"
          fi
          echo "=== KernelSU source integration ==="
          grep -nE 'config KSU|config KSU_SUSFS|KSU_MANUAL_HOOK|KSU_SUSFS' ksu-src/ksun/kernel/Kconfig | head -100 || true
          echo "=== SUSFS Kbuild wiring ==="
          grep -n 'susfs.o' fs/Makefile || true
          echo "=== Build exports ==="
          find build/export -maxdepth 2 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
          echo "=== ZIP integrity and installer checks ==="
          for z in build/export/*.zip build/out/d1xks/*.zip; do
            test -f "$z" || continue
            echo "--- $z"
            unzip -t "$z" | tail -3 || true
            echo "[PACKAGE] ZIP entries:"
            unzip -Z1 "$z" | sed -n "1,100p" || true
            unzip -p "$z" META-INF/com/google/android/updater-script 2>/dev/null | grep -nE 'N971|d1xks|binary|boot' | head -40 || true
          done

      - name: Verify kernel configuration and package
        shell: bash
        run: |
          set -euxo pipefail
          test -s out/.config
          test -s out/fs/susfs.o
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q 'SUSFS_VERSION "v1.5.12"' include/linux/susfs.h
          test -s build/ksu-source-info.txt
          test -d build/export
          ZIP_COUNT=$(find build/export -maxdepth 1 -type f -name '*.zip' | wc -l)
          test "$ZIP_COUNT" -ge 1
          for z in build/export/*.zip; do
            unzip -t "$z" >/dev/null
            unzip -Z1 "$z" | grep -qx 'boot.img'
            unzip -p "$z" boot.img > /tmp/n971n-verified-boot.img
            test -s /tmp/n971n-verified-boot.img
            unzip -Z1 "$z" | grep -qx 'dtb.img'
            unzip -Z1 "$z" | grep -qx 'dtbo.img'
            unzip -Z1 "$z" | grep -qx 'META-INF/com/google/android/updater-script'
          done
          (cd build/export && sha256sum *.zip > SHA256SUMS)
          echo "KernelSU Next + SUSFS config verified:"
          grep -E '^CONFIG_KSU(=|_)' out/.config

      - name: Upload kernel ZIP and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: N971N-KSUN-SUSFS-MINIMAL-${{ github.run_number }}
          path: |
            build/export/*.zip
            build/export/ksu-source-info.txt
            build/export/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
